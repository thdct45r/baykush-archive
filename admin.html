<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>admin panel</h1>

  <div id="login-box">
    <input type="email" id="email" placeholder="e-posta" autocomplete="username">
    <input type="password" id="password" placeholder="şifre" autocomplete="current-password">
    <button id="girisBtn">Giriş yap</button>
    <div id="status"></div>
  </div>

  <div id="upload-box" hidden>
    <div class="oturum">
      <span>Giriş yapıldı ✅</span>
      <button id="cikisBtn" class="ikincil">Çıkış</button>
    </div>

    <div class="form">
      <label for="kategori">Kategori</label>
      <select id="kategori">
        <option value="magnet">Magnet</option>
        <option value="pin">Pin</option>
        <option value="poster">Poster</option>
      </select>

      <label for="aciklama">Açıklama (isteğe bağlı)</label>
      <input type="text" id="aciklama" placeholder="örn. Kırmızı baykuş magneti" maxlength="300">
      <small>Birden fazla fotoğraf seçersen aynı açıklama hepsine eklenir. Sonradan her birini aşağıdaki listeden tek tek değiştirebilirsin.</small>

      <label for="fotoInput">Fotoğraflar (birden fazla seçebilirsin)</label>
      <input type="file" id="fotoInput" accept="image/*" multiple>

      <button id="yukleBtn">Fotoğraf yükle</button>
      <div id="uploadStatus"></div>
    </div>

    <div id="photo-list"></div>
  </div>

  <script>
    // BURAYA eski dosyandaki iki satırı (kendi bilgilerini) yapıştır
    const SUPABASE_URL = "BURAYA_PROJE_URLIN";
    const SUPABASE_ANON_KEY = "BURAYA_ANON_KEYIN";
    const BUCKET = "photos";

    const KATEGORILER = { magnet: "Magnet", pin: "Pin", poster: "Poster" };

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);

    // Giriş durumuna göre ekranı değiştir
    sb.auth.onAuthStateChange((_olay, oturum) => {
      const giris = !!oturum;
      $('login-box').hidden = giris;
      $('upload-box').hidden = !giris;
      if (giris) setTimeout(listeyiYukle, 0);
    });

    $('girisBtn').addEventListener('click', async () => {
      const { error } = await sb.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });
      if (error) $('status').textContent = 'Hata: ' + error.message;
    });

    $('cikisBtn').addEventListener('click', () => sb.auth.signOut());

    // ---------- Yükleme ----------
    $('yukleBtn').addEventListener('click', async () => {
      const durum = $('uploadStatus');
      const dosyalar = Array.from($('fotoInput').files);
      if (!dosyalar.length) { durum.textContent = 'Önce en az bir fotoğraf seç.'; return; }

      const kategori = $('kategori').value;
      const aciklama = $('aciklama').value.trim() || null;
      let basarili = 0;

      for (let i = 0; i < dosyalar.length; i++) {
        durum.textContent = `Yükleniyor... ${i + 1} / ${dosyalar.length}`;
        const dosya = dosyalar[i];
        const parcalar = dosya.name.split('.');
        const uzanti = parcalar.length > 1
          ? parcalar.pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg'
          : 'jpg';
        const yol = `${Date.now()}-${i}-${Math.random().toString(36).slice(2, 7)}.${uzanti}`;

        const yuk = await sb.storage.from(BUCKET).upload(yol, dosya, { contentType: dosya.type });
        if (yuk.error) { durum.textContent = 'Hata: ' + yuk.error.message; break; }

        const kayit = await sb.from('photos').insert({ file_path: yol, category: kategori, caption: aciklama });
        if (kayit.error) {
          await sb.storage.from(BUCKET).remove([yol]);
          durum.textContent = 'Hata: ' + kayit.error.message;
          break;
        }
        basarili++;
      }

      if (basarili === dosyalar.length) {
        durum.textContent = `${basarili} fotoğraf yüklendi ✅`;
        $('fotoInput').value = '';
        $('aciklama').value = '';
      } else if (basarili > 0) {
        durum.textContent += ` (${basarili} tanesi yüklendi)`;
      }
      listeyiYukle();
    });

    // ---------- Liste ----------
    async function listeyiYukle() {
      const liste = $('photo-list');
      const { data, error } = await sb.from('photos').select('*').order('created_at', { ascending: false });
      liste.replaceChildren();
      if (error) { liste.textContent = 'Liste yüklenemedi: ' + error.message; return; }
      if (!data.length) { liste.textContent = 'Henüz fotoğraf yok.'; return; }
      data.forEach(foto => liste.appendChild(kartOlustur(foto)));
    }

    // Güncelleme/silme izinsizse Supabase hata vermeden 0 satır döndürür; bunu yakalıyoruz
    const IZIN_YOK = 'İzin yok ya da kayıt bulunamadı (policy e-postasını kontrol et).';

    async function guncelle(id, alanlar) {
      const { data, error } = await sb.from('photos').update(alanlar).eq('id', id).select('id');
      if (error) return error.message;
      return data && data.length ? null : IZIN_YOK;
    }

    async function kayitSil(id) {
      const { data, error } = await sb.from('photos').delete().eq('id', id).select('id');
      if (error) return error.message;
      return data && data.length ? null : IZIN_YOK;
    }

    function kartOlustur(foto) {
      const kart = document.createElement('div');
      kart.className = 'photo-item';

      const img = document.createElement('img');
      img.src = sb.storage.from(BUCKET).getPublicUrl(foto.file_path).data.publicUrl;
      img.alt = foto.caption || KATEGORILER[foto.category];
      img.loading = 'lazy';

      const sec = document.createElement('select');
      Object.entries(KATEGORILER).forEach(([anahtar, ad]) => {
        const o = document.createElement('option');
        o.value = anahtar;
        o.textContent = ad;
        sec.appendChild(o);
      });
      sec.value = foto.category;
      sec.addEventListener('change', async () => {
        const hata = await guncelle(foto.id, { category: sec.value });
        if (hata) { alert('Hata: ' + hata); sec.value = foto.category; }
        else { foto.category = sec.value; }
      });

      const yazi = document.createElement('div');
      yazi.className = 'aciklama';
      yazi.textContent = foto.caption || 'Açıklama yok';

      const duzenle = document.createElement('button');
      duzenle.className = 'ikincil';
      duzenle.textContent = 'Açıklama';
      duzenle.addEventListener('click', async () => {
        const yeni = prompt('Açıklama:', foto.caption || '');
        if (yeni === null) return;
        const deger = yeni.trim() || null;
        const hata = await guncelle(foto.id, { caption: deger });
        if (hata) { alert('Hata: ' + hata); return; }
        foto.caption = deger;
        yazi.textContent = deger || 'Açıklama yok';
      });

      const sil = document.createElement('button');
      sil.className = 'ikincil';
      sil.textContent = 'Sil';
      sil.addEventListener('click', async () => {
        if (!confirm('Bu fotoğraf silinsin mi?')) return;
        const hata = await kayitSil(foto.id);
        if (hata) { alert('Hata: ' + hata); return; }
        await sb.storage.from(BUCKET).remove([foto.file_path]);
        kart.remove();
      });

      const aksiyon = document.createElement('div');
      aksiyon.className = 'aksiyon';
      aksiyon.append(duzenle, sil);

      kart.append(img, sec, yazi, aksiyon);
      return kart;
    }
  </script>
</body>
</html>
