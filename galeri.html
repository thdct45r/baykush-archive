<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Büyük Arşiv</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="geri" href="index.html">Ana sayfa</a>
  <h1>Büyük Arşiv</h1>
  <nav class="kategoriler" id="kategoriler" aria-label="Kategoriler"></nav>
  <div id="galeri"><p class="mesaj">Yükleniyor...</p></div>
  <footer class="site-footer">
    <ul>
      <li>
        <a href="https://share.google/2KfbZXDJ4s0w3gymA" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Konum
        </a>
      </li>
      <li>
        <a href="https://www.instagram.com/baykush_shop" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          Instagram
        </a>
      </li>
      <li>
        <a href="https://www.facebook.com/baykushshop" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          Facebook
        </a>
      </li>
      <!-- SHOPIER: link hazır olunca bu bloğun başındaki ve sonundaki yorum işaretlerini sil,
           BURAYA_SHOPIER_LINKI yerine mağaza adresini yaz.
      <li>
        <a href="BURAYA_SHOPIER_LINKI" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Shopier
        </a>
      </li>
      -->
    </ul>
  </footer>

  <script>
    // BURAYA eski dosyandaki iki satırı (kendi bilgilerini) yapıştır
    const SUPABASE_URL = "https://fofckiktreldqxyyvksy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZmNraWt0cmVsZHF4eXl2a3N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNTQ2NDIsImV4cCI6MjEwOTczMDY0Mn0.S3i1wdksji3r4K9-OuUvnq3AxVem4CamxnuM4fpAKNo";
    const BUCKET = "photos";

    const KATEGORILER = { magnet: "Magnet", pin: "Pin", poster: "Poster" };

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const galeri = document.getElementById('galeri');
    const menu = document.getElementById('kategoriler');
    let fotolar = [];

    function aktifKategori() {
      const h = location.hash.slice(1);
      return KATEGORILER[h] ? h : 'tumu';
    }

    function mesaj(metin) {
      galeri.replaceChildren();
      const p = document.createElement('p');
      p.className = 'mesaj';
      p.textContent = metin;
      galeri.appendChild(p);
    }

    function menuyuCiz(aktif) {
      menu.replaceChildren();
      const secenekler = [['tumu', 'Tümü']].concat(Object.entries(KATEGORILER));
      secenekler.forEach(([anahtar, ad]) => {
        const sayi = anahtar === 'tumu'
          ? fotolar.length
          : fotolar.filter(f => f.category === anahtar).length;
        const a = document.createElement('a');
        a.href = '#' + anahtar;
        a.textContent = ad;
        const s = document.createElement('span');
        s.className = 'sayi';
        s.textContent = sayi;
        a.appendChild(s);
        if (anahtar === aktif) a.setAttribute('aria-current', 'page');
        menu.appendChild(a);
      });
    }

    function goster() {
      const aktif = aktifKategori();
      menuyuCiz(aktif);

      const liste = aktif === 'tumu' ? fotolar : fotolar.filter(f => f.category === aktif);
      if (!liste.length) {
        mesaj(fotolar.length ? 'Bu kategoride henüz fotoğraf yok.' : 'Henüz fotoğraf yok.');
        return;
      }

      galeri.replaceChildren();
      liste.forEach(foto => {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        img.src = sb.storage.from(BUCKET).getPublicUrl(foto.file_path).data.publicUrl;
        img.alt = foto.caption || KATEGORILER[foto.category] || 'Fotoğraf';
        img.loading = 'lazy';
        fig.appendChild(img);
        if (foto.caption) {
          const cap = document.createElement('figcaption');
          cap.textContent = foto.caption;
          fig.appendChild(cap);
        }
        galeri.appendChild(fig);
      });
    }

    async function yukle() {
      const { data, error } = await sb
        .from('photos')
        .select('id, file_path, category, caption')
        .order('created_at', { ascending: false });
      if (error) {
        mesaj('Fotoğraflar yüklenirken hata oluştu: ' + error.message);
        return;
      }
      fotolar = data || [];
      goster();
    }

    window.addEventListener('hashchange', goster);
    yukle();
  </script>
</body>
</html>
